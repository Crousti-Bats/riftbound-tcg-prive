name: Déploiement production

# Se déclenche après chaque merge sur main (main est protégée : la CI a déjà validé la PR).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    name: Déployer sur Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://riftbound-tcg.${{ vars.CLOUDFLARE_SOUS_DOMAINE }}.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (filet de sécurité avant mise en prod)
        run: npm test
      - run: npm run build
      - name: Migrations de la base D1 (production)
        run: npx wrangler d1 migrations apply riftbound-tcg --remote --config configuration/cloudflare-wrangler.jsonc
      - name: Déploiement du Worker et du site
        run: npx wrangler deploy --config dist/riftbound_tcg/wrangler.json
      - name: Vérification après déploiement
        run: |
          url="https://riftbound-tcg.${{ vars.CLOUDFLARE_SOUS_DOMAINE }}.workers.dev/api/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q '"status":"ok"'; then echo "OK : $url"; exit 0; fi
            sleep 10
          done
          echo "::error::$url ne répond pas ok"; exit 1
